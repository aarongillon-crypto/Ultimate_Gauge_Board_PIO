; M5Stack Tab5 (ESP32-P4 + ESP32-C6) — Phase 0 ESP-NOW spike
; Open THIS folder as its own PlatformIO project (separate from the gauge at repo root).
;
; NOTE: ESP32-P4 Arduino support is new. If the board id or build fails, the
; likely fixes are noted in README.md. We expect a compile iteration or two.

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Tab5 isn't a named board yet — use the generic P4 dev module. Verify against
; `pio boards esp32p4` if this id is rejected (candidates: esp32-p4, esp32p4, esp32-p4-evboard).
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_build.f_cpu = 360000000L

; M5Unified brings up the Tab5 board correctly (C6 link, antenna IO-expander),
; which is required before any wireless will work.
lib_deps =
    m5stack/M5Unified
