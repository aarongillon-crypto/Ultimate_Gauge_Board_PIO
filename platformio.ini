; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:esp32-s3-devkitc1-n8r8]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; board = esp32-s3-devkitc1-n8r8
; framework = arduino
; lib_deps = 
;     lvgl/lvgl@^9.3.0
;     WiFi
;     WebServer
;     Preferences
; monitor_speed = 115200
; build_flags = 
;  -D ARDUINO_USB_MODE=1
;  -D ARDUINO_USB_CDC_ON_BOOT=1
;  -DLV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""
[env:esp32-s3-devkitc1-n8r8]
; Pinned: pioarduino 55.03.38 = Arduino core 3.3.8 / ESP-IDF 5.5.4 — the exact
; platform this firmware has been validated on. The `stable` tag floats (it now
; resolves to 55.03.312 / Arduino 3.3.12), so pin the release explicitly.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200

; --- OTA UPLOAD (connect PC to gauge WiFi AP first) ---
; pio run -t upload --upload-port 192.168.4.1
; Or uncomment these two lines to make OTA the default upload method:
; upload_protocol = espota
; upload_port = 192.168.4.1

; --- MEMORY & SPEED OPTIMIZATIONS ---
board_build.arduino.memory_type = qio_opi 
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; --- PARTITION SCHEME (More App Space) ---
board_build.partitions = default_8MB.csv

; NOTE: CONFIG_LCD_RGB_RESTART_IN_VSYNC=y would auto re-align the RGB DMA every
; VSYNC and kill the layout-reload shift with the bounce buffer on — but setting
; it via custom_sdkconfig forces a full ESP-IDF CMake rebuild that this pioarduino
; install (precompiled libs, no cmake/ninja toolchain) can't run. Left off.

; Dependencies are pinned EXACTLY, not floated. This firmware gets flashed into a
; car, so a fresh clone or a `pio pkg update` must not silently move LVGL or the
; Arduino core under a binary that was validated on the bench. Bump deliberately.
lib_deps =
 lvgl/lvgl@9.6.0
 bblanchon/ArduinoJson@7.4.3
 WiFi
 WebServer
 Preferences

; pre:  regenerate src/web/assets_gen.h (gzipped SPA) from web/* before build.
; post: copy the built firmware into releases/ as vX.Y.Z.bin + .factory.bin.
extra_scripts =
 pre:tools/build_web.py
 post:tools/copy_release.py

build_flags =
 -D ARDUINO_USB_MODE=1
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -DLV_CONF_PATH="\"${PROJECT_DIR}/include/lv_conf.h\""
    -O3
    -D LV_USE_LOG=0

; CAN bus speed is now runtime-selectable in the web UI (CAN Bus card):
; 1 Mbit = Haltech, 500 kbit = Evo/OEM discovery (sniffer shows all frames raw).
; No separate build env needed — one firmware covers both cars.